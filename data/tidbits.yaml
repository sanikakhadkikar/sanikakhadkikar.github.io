  paper: yellow
- text: "Liberia's name comes from the Latin word for free."
  source: from Bent but Never Broken
  paper: card
- text: "For millions of years, bats were New Zealand's only native land mammals."
  source: from Birds of a Different Feather
  paper: receipt
- text: "The bridge at Manaus crosses the Rio Negro. The Amazon itself has no bridge."
  source: from Not Shackled by a Bridge
  paper: pink
- text: "Some sea cucumbers expel their guts when threatened, then grow them back."
  source: from Sea Cucumbers
  paper: kraft
- text: "Egypt brought back daylight saving time in 2023 to cut energy use."
  source: from Energy Saving Time
  paper: yellow
