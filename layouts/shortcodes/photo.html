{{ with .Page.Resources.Get (.Get "src") }}
<figure class="nc-meme nc-photo">
  <img src="{{ .RelPermalink }}" alt="{{ $.Get "alt" }}" loading="lazy">
  <figcaption>{{ $.Get "caption" | markdownify }}
    {{- if $.Get "credit" }}
    <span class="nc-credit">{{ with $.Get "credit_url" }}<a href="{{ . }}">{{ $.Get "credit" }}</a>{{ else }}{{ $.Get "credit" }}{{ end }}.</span>
    {{- else }}
    <span class="nc-credit">
      {{- with $.Get "by" }}Photo by {{ . }}{{ end -}}
      {{- with $.Get "source" }}{{ if $.Get "by" }}, via {{ else }}Via {{ end }}<a href="{{ . }}">Wikimedia Commons</a>{{ end -}}
      {{- with $.Get "license" }}, {{ with $.Get "license_url" }}<a href="{{ . }}">{{ $.Get "license" }}</a>{{ else }}{{ $.Get "license" }}{{ end }}{{ end }}.</span>
    {{- end }}
  </figcaption>
</figure>
{{ end }}
